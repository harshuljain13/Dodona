[pytest]
# infra/control holds gateway, router, edge and kernels — one import root since
# the Kubernetes path moved to its own branch and kernels came with the control
# plane that imports it.
# benchmarking/ holds prom.py, slos.py and utils.py — the measurement side,
# which is deliberately separate from the control plane it measures.
pythonpath = ../infra/control ../benchmarking
testpaths = .
addopts = -q
markers =
    live: a real vLLM behind PREFILL_URLS (skipped unless that env is set)
