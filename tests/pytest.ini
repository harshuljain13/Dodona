[pytest]
# control/ holds gateway, router and edge; cluster/ holds observability
# and kernels. Both are import roots — missing the second is why
# test_dashboards and test_kernels failed to collect after the move.
pythonpath = ../infra/control ../infra/cluster
testpaths = .
addopts = -q
markers =
    lambda: live vLLM behind PREFILL_URLS (skipped unless that env is set)
