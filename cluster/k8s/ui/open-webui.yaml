# Open WebUI — hand testing, stage 1.
# Points at the GATEWAY, not at a pool. The brief: "Completions that skip
# guardrails / admit / place / queue do not count." So hand testing goes
# through the same serve path the agent will — which means this is unusable
# until orch-serve is deployed at stage 4, and that is the correct order.
apiVersion: apps/v1
kind: Deployment
metadata: { name: open-webui }
spec:
  replicas: 1
  selector: { matchLabels: { app: open-webui } }
  template:
    metadata: { labels: { app: open-webui } }
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          env:
            - { name: OPENAI_API_BASE_URL, value: "http://orch-serve:8080/v1" }
            - { name: OPENAI_API_KEY,      value: "dummy" }
            - { name: WEBUI_AUTH,          value: "False" }
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: open-webui }
spec:
  type: NodePort
  selector: { app: open-webui }
  ports: [{ port: 80, targetPort: 8080, nodePort: 30030 }]
