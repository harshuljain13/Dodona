apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prefill-scaler
spec:
  scaleTargetRef:
    name: vllm-prefill
  minReplicaCount: 1
  maxReplicaCount: 2
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        threshold: "1"
        query: orch_tokens_in_flight{phase="prefill"}
