# Dodona's voice agent: deep research, spoken, answered by OUR GPU.
#
#   make app            the AgentShip service + the web UI
#
# The only thing this file says about infrastructure is `api_base`. That points
# at the gateway on 127.0.0.1:8080, which is the whole point of the project — a
# completion that skips guard / admit / place / queue does not count, so there is
# no route from here to a worker that bypasses the serve path.
name: dodona
engine: langgraph
template: single
# Named explicitly, which means this line and .env have to agree: the gateway's
# guard allows only `text`, `vision`, and whatever $TEXT_MODEL / $LOCAL_MODEL
# names, so a model the fleet is not serving is 400 model_not_allowed on every
# turn. Verified against the running gateway:
#
#   Qwen/Qwen2.5-32B-Instruct-AWQ   200   (what LOCAL_MODEL names)
#   Qwen/Qwen2.5-7B-Instruct-AWQ    400   model_not_allowed
#
# `openai/text` is the alias and needs no edit when the fleet's model changes.
# This is the explicit form: change the fleet, change this line too.
model: openai/Qwen/Qwen2.5-32B-Instruct-AWQ
durability: checkpoint

params:
  # The gateway, reached through the tunnel — `make fleet-runpod-ssh` on a
  # rented box, `make ssh` on the Kubernetes path. Not a vLLM pod: the point of
  # the experiment is what the control plane does to a request on its way
  # through. Nothing here is reachable until the tunnel is open, which is what
  # the app's "cluster unavailable" banner is reporting.
  api_base: http://127.0.0.1:8080/v1
  # Off, because this gateway does not really stream: it buffers the whole
  # completion and `sse_from_completion` re-emits it as ONE chunk built from the
  # assistant text alone — `tool_calls` are not copied into the delta at all.
  #
  # The symptom is not slow output, it is `web_search` and `scrape_url` silently
  # never running: a streamed tool call arrives in fragments the client
  # reassembles, and a single buffered chunk gives it nothing to reassemble, so
  # the call is dropped with no error. Dodona then says it will look something
  # up and answers from memory instead, which is the hardest kind of failure to
  # notice out loud. AgentShip measured it as: streaming on -> 0 tool calls,
  # off -> 1.
  streaming: true
  # Spoken answers are short. This also keeps a turn inside the 30s budget when
  # research runs long.
  max_tokens: 400
  temperature: 0.3

tools:
  - web_search
  - scrape_url

prompt: >-
  You are Dodona, a research assistant that is being LISTENED to, not read.
  Never use lists, headings, bullet points or markdown — none of it can be
  heard. If you have several points, say them in sentences.

  For greetings and small talk, reply naturally in one short sentence and use no
  tools.

  When asked something substantive, say one short line out loud first so the
  listener knows you are working — "let me look that up" — and then research it:
  break the question into sub-questions and call web_search for each; open the
  two or three most authoritative results with scrape_url, because a snippet is
  not evidence; cross-check across sources rather than trusting one.

  Then answer in three or four spoken sentences and name the sources out loud by
  publication, not by URL — a link read aloud is noise. Prefer being correct over
  being quick, but remember the listener is waiting in silence.

voice:
  # AgentShip owns the whole cascade — ears, turn-taking, mouth — and every key
  # below is read rather than decorative. The LiveKit adapter implements only
  # host() and witness(), so on that path this block was advisory and the agent
  # worker hand-built a session beside it. Everything here runs on the laptop;
  # only `api_base` above leaves it.
  framework: pipecat
  # Deepgram for both ears and mouth: one account, and nova-3 is markedly more
  # accurate on live audio than a batch transcriber fed one VAD segment at a
  # time. A misheard question is answered confidently and wrongly.
  stt: deepgram
  stt_model: nova-3
  tts: deepgram
  # Conversational pace. Provider defaults are tuned for narration, which sounds
  # sluggish when someone is waiting for their turn.
  tts_speed: 1.1
  # What you are expected to speak. Without it the recogniser guesses per
  # utterance and gets short ones wrong.
  language: en
  # Spoken on joining, before the listener has said anything, and through TTS
  # only — it is not a completion, so it works whether or not the cluster is up.
  # Without a greeting the session waits in silence, and a working agent and a
  # dead one sound exactly alike.
  greeting: Dodona here. Ask me something and I will go and read the sources.
  # Runs locally, costs nothing, needs no key.
  vad: silero
  # Spoken when a turn raises, and it names the recovery because the most likely
  # cause needs one.
  #
  # Interruptions are on, and pipecat lowers its word floor to 1 whenever the bot
  # is not SPEAKING — which includes the half minute it spends researching in
  # silence. So a cough mid-turn cancels the run between a tool call and its
  # result, `durability: checkpoint` saves that half-finished state against the
  # session, and langgraph then refuses every later turn on it:
  # "Found AIMessages with tool_calls that do not have a corresponding
  # ToolMessage". The session is dead and the fleet is perfectly healthy.
  #
  # Reconnecting is what clears it, so the apology says so rather than leaving a
  # listener to ask the same question louder. The web UI matches this exact
  # string to show the same hint on screen — the voice socket sends a failed turn
  # as an ordinary `said`, so the text IS the signal.
  fallback_text: Sorry, that turn failed. Stop the call and start talking again, and I will be fine.
