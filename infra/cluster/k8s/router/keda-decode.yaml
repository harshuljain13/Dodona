# Scale the decode pool on KV pressure.
#
# The old threshold was "1" against vllm:kv_cache_usage_perc, which is a ratio
# in 0..1 — so it could only fire at 100% KV, i.e. never. 0.70 is below the
# ~4.9-sequence limit a 12 GiB slice reaches, so this actually triggers.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: decode-scaler
spec:
  scaleTargetRef:
    name: vllm-decode
  minReplicaCount: 1
  maxReplicaCount: 2
  # Scale up fast, down slowly: a decode pod takes minutes to load weights, so
  # flapping costs far more than running one extra replica for a while.
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        threshold: "0.70"
        query: avg(vllm:kv_cache_usage_perc{phase="decode"})
