persistence:
  enabled: false
service:
  type: NodePort
  # Pinned. The chart picks a random NodePort otherwise, and the ssh tunnel
  # forwards a fixed list — a random one means Grafana is simply unreachable
  # from the Mac, with nothing to say why.
  nodePort: 31495
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true
        editable: true
