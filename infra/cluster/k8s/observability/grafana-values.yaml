persistence:
  enabled: false
service:
  type: NodePort
  # Pinned. The chart picks a random NodePort otherwise, and the ssh tunnel
  # forwards a fixed list — a random one means Grafana is simply unreachable
  # from the Mac, with nothing to say why.
  nodePort: 31495
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true
        editable: true

# Server-side rendering, for /render/d-solo/<uid>?panelId=N -> PNG.
# renderer.yaml provides the service; without both, /render returns 500.
env:
  GF_RENDERING_SERVER_URL: http://grafana-renderer.monitoring.svc.cluster.local:8081/render
  GF_RENDERING_CALLBACK_URL: http://grafana.monitoring.svc.cluster.local/
  GF_LOG_FILTERS: rendering:debug
