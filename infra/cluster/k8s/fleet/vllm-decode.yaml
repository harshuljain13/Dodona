# Decode pool — TWO replicas, slices 1 and 2.
#
# gpumem 12288 is what the pod sees as its WHOLE device, so vLLM's
# --gpu-memory-utilization 0.90 applies to 12 GiB, not to the card's 40.
# 12 x 0.90 - 5.20 weights - 0.80 runtime = 4.80 GiB of KV.
#
# ONE replica at rest; KEDA scales to two under load. That keeps the scaler
# observable rather than installed-and-inert, and makes pick() a real decision
# exactly when there is load worth placing. ~4.3 GiB of KV / 0.875 GiB per 16k
# sequence = ~4.9 sequences per replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-decode
  labels: { app: vllm-decode, phase: decode }
spec:
  replicas: 1
  # Recreate, not RollingUpdate. The default surges a new pod before retiring
  # the old one, and on a fully-allocated GPU the replacement can never be
  # scheduled — it sits Pending forever and the rollout hangs. A single card
  # cannot be rolled without downtime; pretending otherwise just deadlocks.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: vllm-decode, phase: decode }
  template:
    metadata:
      labels: { app: vllm-decode, phase: decode }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      schedulerName: hami-scheduler
      volumes:
        # One cache for every pod. Without this each replica re-downloads
        # 5.6 GB, and three pods starting together will saturate the disk.
        - name: hf-cache
          hostPath: { path: /home/ubuntu/.cache/huggingface, type: DirectoryOrCreate }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
        # RDMA, into the pod. Without this Mooncake logs "No RDMA devices found"
        # and silently falls back to TCP — it works, but not at RDMA speed.
        - name: infiniband
          hostPath: { path: /dev/infiniband }
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          # kv_load_failure_policy=recompute: a failed transfer falls back to
          # local compute. The default, `fail`, 500s the request and then kills
          # the EngineCore on the late completion — it took decode down.
          env:
            - { name: WITH_NVIDIA_PEERMEM, value: "1" }
          # Mooncake consumer. bootstrap_server_address points at the prefill
          # pod's embedded server — that is how this pod discovers the blocks
          # the producer wrote instead of re-prefilling the prompt.
          command: ["sh", "-c"]
          # NOTE: everything below `args:` is ONE folded shell command. A `#` in a
          # YAML folded scalar is NOT a comment — it folds into the string, and
          # the shell then treats it as a comment and discards the rest of the
          # line. Doing that here silently dropped --enable-auto-tool-choice,
          # --host, --port and --kv-transfer-config. Explanations go HERE.
          #
          # --custom-histogram-buckets: vLLM's default request_latency buckets
          # start at 0.3s and are shared by e2e, queue, inference, prefill and
          # decode. Every request here finishes under 100ms, so 96-100% of
          # samples land in the first bucket and histogram_quantile returns the
          # same p50/p90/p99 for all five while their true means differ 17x.
          args:
            - >-
              pip install -q mooncake-transfer-engine-cuda13 &&
              exec vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ
              --served-model-name=Qwen/Qwen2.5-7B-Instruct-AWQ
              --max-model-len=16384
              --max-num-seqs=64
              --gpu-memory-utilization=0.90
              --enable-prefix-caching
              --custom-histogram-buckets '{"request_latency":[0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10,30,60,120]}'
              --enable-auto-tool-choice
              --tool-call-parser=hermes
              --host=0.0.0.0 --port=8000
              --kv-transfer-config '{"kv_connector":"MooncakeConnector","kv_role":"kv_consumer","kv_load_failure_policy":"recompute","kv_connector_extra_config":{"mooncake_protocol":"rdma","device_name":"mlx5_0","bootstrap_server_address":"vllm-prefill:8998"}}'
          ports: [{ name: http, containerPort: 8000 }]
          volumeMounts:
            - { name: hf-cache, mountPath: /root/.cache/huggingface }
            - { name: shm, mountPath: /dev/shm }
            # Mooncake probes /dev/infiniband to discover HCAs.
            - { name: infiniband, mountPath: /dev/infiniband }
          # RDMA pins memory, which needs IPC_LOCK, and reaches the verbs
          # device directly.
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          # READY must not mean "can serve". startupProbe gives the engine up to
          # 20 minutes to load weights and capture CUDA graphs; readinessProbe
          # only then starts gating traffic.
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            limits:
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "12288"   # 12 GiB — the slice, not the card
              nvidia.com/gpucores: "28"    # 2 x 28 + 40 = 96%
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-decode
  labels: { app: vllm-decode, phase: decode }
spec:
  # NodePort, not ClusterIP: ClusterIP is invisible from the host, so the ssh
  # tunnel has nothing to forward and the fleet is unreachable from the Mac.
  type: NodePort
  selector: { app: vllm-decode, phase: decode }
  ports: [{ name: http, port: 8000, targetPort: 8000, nodePort: 30801 }]
