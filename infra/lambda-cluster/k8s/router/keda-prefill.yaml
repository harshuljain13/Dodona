# Scale the prefill pool on queued prompt work.
#
# orch_tokens_in_flight is emitted by the gateway, so this is dead until
# orch-serve is deployed. Threshold is a TOKEN count, not a request count: 1
# would scale on a single token in flight.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prefill-scaler
spec:
  scaleTargetRef:
    name: vllm-prefill
  minReplicaCount: 1
  maxReplicaCount: 2
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local
        # ~2 full 16k prefills queued. Below this one worker keeps up.
        threshold: "32768"
        query: sum(orch_tokens_in_flight{phase="prefill"})
