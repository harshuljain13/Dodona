<?xml version="1.0" encoding="UTF-8"?>
<!-- BRIEF: Dodona banner. Simple. White background, dodona-green (#047857) wordmark,
     one-line tagline, single thin green accent bar at the bottom. No motif, no icon,
     no grid. Size: 1280x260. IDs: bg, wordmark, tagline, accent.
     Same construction as AdmitPerf's banner, inverted to white-on-green. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Dodona — self-hosted voice research on one GPU">
  <g id="bg">
    <rect width="1280" height="260" fill="#FFFFFF"/>
  </g>

  <g id="wordmark" font-family="Helvetica, Arial, sans-serif" font-weight="900">
    <text x="640" y="140" font-size="128" letter-spacing="-3" text-anchor="middle">
      <tspan fill="#047857">Dod</tspan><tspan fill="#0F172A">ona</tspan>
    </text>
  </g>

  <g id="tagline" font-family="Helvetica, Arial, sans-serif">
    <text x="640" y="188" font-size="20" fill="#6B7F78" font-weight="400" letter-spacing="3" text-anchor="middle">
      self-hosted voice research on one GPU
    </text>
  </g>

  <g id="accent">
    <rect x="560" y="214" width="160" height="4" fill="#10B981"/>
  </g>
</svg>
