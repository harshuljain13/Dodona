<?xml version="1.0" encoding="UTF-8"?>
<!-- BRIEF: Dodona banner. Simple. Black background, white wordmark with a single cyan
     period, one-line tagline, one thin cyan accent bar at the bottom. No motif, no icon,
     no grid, no two-tone split. Size: 1280x260. IDs: bg, wordmark, tagline, accent.
     Same construction as AdmitPerf's banner; cyan rather than yellow so the two
     projects do not read as the same thing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Dodona — self-hosted voice research on one GPU">
  <g id="bg">
    <rect width="1280" height="260" fill="#0B0B0B"/>
  </g>

  <g id="wordmark" font-family="Helvetica, Arial, sans-serif" font-weight="900">
    <text x="640" y="142" font-size="128" letter-spacing="-3" text-anchor="middle">
      <tspan fill="#FFFFFF">Dodona</tspan><tspan fill="#22D3EE">.</tspan>
    </text>
  </g>

  <g id="tagline" font-family="Helvetica, Arial, sans-serif">
    <text x="640" y="190" font-size="20" fill="#9AA4B2" font-weight="400" letter-spacing="3.5" text-anchor="middle">
      self-hosted voice research on one GPU
    </text>
  </g>

  <g id="accent">
    <rect x="580" y="216" width="120" height="4" fill="#22D3EE"/>
  </g>
</svg>
