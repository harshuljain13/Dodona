<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" width="960" height="190" role="img" aria-label="Dodona — self-hosted voice research, and the cluster that gates it">
  <title>Dodona</title>

  <!-- background -->
  <rect width="960" height="190" rx="14" fill="#0b1220"/>
  <rect x="0.5" y="0.5" width="959" height="189" rx="13.5" fill="none" stroke="#1d2a3e"/>

  <!-- mark: a leaf drawn as two arcs, its midrib a signal.
       The oracle at Dodona read answers from the sound of wind in the oak leaves. -->
  <g transform="translate(60,47)">
    <rect width="96" height="96" rx="12" fill="#101b2d" stroke="#23324a"/>
    <g transform="translate(48,48)" fill="none" stroke="#5eead4" stroke-linecap="round">
      <!-- leaf: mirrored arcs meeting at the tips -->
      <path d="M0 -30 A 30 30 0 0 1 0 30 A 30 30 0 0 1 0 -30 Z" stroke-width="2.4" opacity="0.95"/>
      <!-- midrib -->
      <path d="M0 -30 L0 30" stroke-width="1.6" opacity="0.5"/>
      <!-- veins, shortening toward the tip -->
      <g stroke-width="1.6" opacity="0.75">
        <path d="M0 -14 L11 -20"/><path d="M0 -14 L-11 -20"/>
        <path d="M0 0 L14 -5"/><path d="M0 0 L-14 -5"/>
        <path d="M0 14 L11 10"/><path d="M0 14 L-11 10"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <text x="196" y="88" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="600" letter-spacing="7.5" fill="#edf2f8">DODONA</text>

  <!-- rule -->
  <rect x="198" y="106" width="86" height="1.5" fill="#5eead4" opacity="0.85"/>

  <text x="198" y="134" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Helvetica, Arial, sans-serif"
        font-size="16.5" font-weight="400" letter-spacing="0.3" fill="#8b9bb4">Self-hosted voice research — and the cluster that decides what it may ask</text>

  <!-- right rail: the fleet, as three slices of one card -->
  <g transform="translate(800,47)">
    <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10.5" letter-spacing="1.4" fill="#5b6b84">1 × A100-40GB</text>
    <g>
      <rect x="0"  y="26" width="100" height="16" rx="3" fill="#13223a" stroke="#2a3a55"/>
      <rect x="0"  y="26" width="31"  height="16" rx="3" fill="#1e3a5f"/>
      <rect x="0"  y="48" width="100" height="16" rx="3" fill="#13223a" stroke="#2a3a55"/>
      <rect x="0"  y="48" width="31"  height="16" rx="3" fill="#14564c"/>
      <rect x="0"  y="70" width="100" height="16" rx="3" fill="#13223a" stroke="#2a3a55"/>
      <rect x="0"  y="70" width="31"  height="16" rx="3" fill="#14564c"/>
    </g>
    <text x="36" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#6f8099">prefill</text>
    <text x="36" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#6f8099">decode</text>
    <text x="36" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#6f8099">decode</text>
  </g>
</svg>
